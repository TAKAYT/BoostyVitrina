name: Update Library

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      vote_item_id:
        description: 'ID тайтла для ручного добавления голоса (необязательно)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        env:
          MANUAL_VOTE_ITEM_ID: ${{ github.event.inputs.vote_item_id }}
        run: python update.py

      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add data.json stats.json votes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update library, Russian UTM tags and votes.json" && git pull --rebase --autostash origin main && git push)

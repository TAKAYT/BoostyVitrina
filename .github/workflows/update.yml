name: Update Library

on:
  schedule:
    - cron: '0 */4 * * *' # Запуск каждые 4 часа автоматически
  workflow_dispatch: # Кнопка для ручного запуска скрипта

permissions:
  contents: write # Разрешение на перезапись data.json

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run update script
        run: python update.py

      - name: Commit and push changes
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update data.json" && git push)
